name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Corepack must be enabled before setup-node: its yarn cache step runs
      # `yarn`, which otherwise resolves to the runner's global Yarn 1 and
      # fails against the "packageManager": "yarn@4.6.0" field.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Smoke tests
        run: yarn test:smoke
